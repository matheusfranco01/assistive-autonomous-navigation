GlobalPlanner:
  use_dijkstra: false      # false = usa A* (true seria Dijkstra puro)
  use_grid_path: true     # false = caminho mais suave, guiado por gradiente
  old_navfn_behavior: false
  allow_unknown: true      # permite planejar por área desconhecida do mapa
  planner_window_x: 0.0
  planner_window_y: 0.0
  default_tolerance: 0.0
  publish_potential: true
  lethal_cost: 253
  neutral_cost: 50
  cost_factor: 3.0
  outline_map: true
